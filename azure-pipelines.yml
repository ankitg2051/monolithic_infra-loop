- stage: Build_artifacts
  jobs:
    - job: building
      steps:
        - task: UseDotNet@2
          inputs:
            packageType: 'sdk'
            version: '8.x'
        
        - script: |
            dotnet restore app/
            dotnet build app/ --configuration Release
            dotnet publish app/ -c Release -o $(Build.ArtifactStagingDirectory)
          displayName: build

        
        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: '$(Build.ArtifactStagingDirectory)'
            artifactName: 'AnkitBuild'

- stage: deploy_stage
  dependsOn: Build_artifacts
  condition: succeeded('Build_artifacts')
  jobs:
    - job: deploying
      steps:
      - task: DownloadBuildArtifacts@1
        inputs:
          buildType: 'current'
          downloadType: 'single'
          artifactName: 'AnkitBuild'
          downloadPath: '$(System.ArtifactsDirectory)'
      - task: AzureWebApp@1
        inputs:
          azureSubscription: 'goyal-app'
          appType: 'webAppLinux'
          appName: 'dotnet-static-app-ankitg2051'
          package: '$(System.ArtifactsDirectory)/AnkitBuild'
          runtimeStack: 'DOTNETCORE|8.0'